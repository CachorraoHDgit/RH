<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RH · Cachorrão HD</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try { if (localStorage.getItem('rh-tema') === 'escuro') document.documentElement.classList.add('dark'); } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="lateral" id="lateral">
      <div class="lateral-marca">
        <div class="lateral-logo"><img src="img/logo.png" alt="Cachorrão Hotdog"></div>
        <div class="lateral-nome">Grupo CHD</div>
      </div>
      <div class="divisor"></div>
      <nav class="lateral-nav">
        <div class="setor">Operação · RH</div>
        <div id="abas"></div>
      </nav>
      <div class="divisor"></div>
      <span id="nuvem-status" class="nuvem-status"></span>
      <div class="lateral-rodape">
        <span class="rodape-texto">Tema</span>
        <button class="tema" data-acao="tema" aria-label="Alternar tema claro/escuro" title="Tema claro/escuro">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </aside>
    <div class="fundo-menu" data-acao="menu"></div>

    <div class="principal">
      <div class="barra-celular">
        <button class="menu-btn" data-acao="menu" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <img src="img/logo.png" alt="" class="logo-celular">
        <strong>RH</strong>
      </div>
      <div id="lembrete"></div>
      <main id="tela"></main>
    </div>
  </div>
  <div id="modal" class="modal" hidden></div>

  <script src="js/datas.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/regras.js"></script>
  <script src="js/ponto.js"></script>
  <script src="js/nuvem.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
